openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: VoltArena session-only portfolio data inspection API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: portfolio
    description: Session-only portfolio input and market-data inspection
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /market-data/universe:
    get:
      operationId: getMarketDataUniverse
      tags: [portfolio]
      summary: Get configured Indian market symbols
      responses:
        "200":
          description: Configured symbols and their default instrument details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDataUniverse"
  /portfolio/csv-preview:
    post:
      operationId: previewPortfolioCsv
      tags: [portfolio]
      summary: Parse a CSV in memory and suggest column mappings
      description: Portfolio CSV content is processed in memory only and is not stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CsvPreviewInput"
      responses:
        "200":
          description: CSV headers, rows, and suggested mappings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvPreviewReport"
        "400":
          description: CSV is invalid or exceeds input limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioInputError"
  /portfolio/validate:
    post:
      operationId: validatePortfolioInput
      tags: [portfolio]
      summary: Validate portfolio rows without fetching market data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioInspectInput"
      responses:
        "200":
          description: Normalized rows and row-specific validation issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioValidationReport"
        "400":
          description: Portfolio input could not be validated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioInputError"
  /portfolio/inspect:
    post:
      operationId: inspectPortfolioMarketData
      tags: [portfolio]
      summary: Validate a confirmed portfolio and inspect its market history
      description: >
        This endpoint is called only after the user confirms the portfolio.
        It does not persist holdings. Market history comes from Yahoo Finance
        through yfinance and is reported with per-instrument provenance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioInspectInput"
      responses:
        "200":
          description: Per-instrument market history and data-quality report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioInspectReport"
        "400":
          description: Invalid portfolio input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioInputError"
        "502":
          description: Market-data provider could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioInputError"
  /portfolio/risk-analysis:
    post:
      operationId: analyzePortfolioRisk
      tags: [portfolio]
      summary: Replay documented crash windows and calculate risk contribution and recovery
      description: >
        Python retrieves source history and calculates every financial figure.
        Holdings are not persisted. Missing stock history may only use an
        explicitly configured sector-index proxy; ETFs are never proxied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioInspectInput"
      responses:
        "200":
          description: Historical replay, risk contribution, recovery, and per-instrument coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioRiskAnalysisReport"
        "400":
          description: Invalid portfolio input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioInputError"
        "502":
          description: Market-data provider could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioInputError"
  /scenarios:
    get:
      operationId: getStaticScenarios
      tags: [portfolio]
      summary: Get the checked-in hypothetical JSON scenario library and simulation defaults
      responses:
        "200":
          description: Static scenarios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaticScenarioLibrary"
        "502":
          description: Static library unavailable or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioInputError"
  /portfolio/stress-analysis:
    post:
      operationId: runPortfolioStress
      tags: [portfolio]
      summary: Calculate hypothetical scenario impact, reverse stress, and joint-block Monte Carlo in Python
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioStressInput"
      responses:
        "200":
          description: Python-computed stress and simulated results with source provenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioStressReport"
        "400":
          description: Invalid scenario, target, or holdings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioInputError"
        "502":
          description: Python engine unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioInputError"
  /game/settings:
    get:
      operationId: getGameSettings
      tags: [portfolio]
      summary: Get Python-owned scoring rules and benchmark assumptions
      responses:
        "200":
          description: Fixed scoring settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSettings"
        "502":
          description: Settings unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioInputError"
  /portfolio/resilience:
    post:
      operationId: analyzePortfolioResilience
      tags: [portfolio]
      summary: Run 500 hidden scenarios, certified CVaR par Levels, panic rehearsal, and Crash Card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResilienceInput"
      responses:
        "200":
          description: Python-only scoring and templated outputs; no hidden outcome matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResilienceReport"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioInputError"
        "502":
          description: Python calculation unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioInputError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    InstrumentType:
      type: string
      enum: [stock, etf]
    Exchange:
      type: string
      enum: [NSE, BSE]
    PortfolioHolding:
      type: object
      properties:
        ticker:
          type: string
          minLength: 1
          maxLength: 20
          pattern: "^[A-Za-z0-9][A-Za-z0-9.&_-]*$"
        exchange:
          $ref: "#/components/schemas/Exchange"
        instrumentType:
          $ref: "#/components/schemas/InstrumentType"
        quantity:
          type: string
          minLength: 1
          maxLength: 32
      required: [ticker, exchange, instrumentType, quantity]
    PortfolioInspectInput:
      type: object
      properties:
        holdings:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/PortfolioHolding"
      required: [holdings]
    CsvPreviewInput:
      type: object
      properties:
        csvText:
          type: string
          minLength: 1
          maxLength: 80000
      required: [csvText]
    CsvPreviewRow:
      type: object
      properties:
        rowNumber:
          type: integer
          minimum: 2
        cells:
          type: array
          items:
            type: string
      required: [rowNumber, cells]
    CsvColumnMappingSuggestions:
      type: object
      properties:
        tickerColumn:
          type: ["string", "null"]
        quantityColumn:
          type: ["string", "null"]
        exchangeColumn:
          type: ["string", "null"]
        instrumentTypeColumn:
          type: ["string", "null"]
      required: [tickerColumn, quantityColumn, exchangeColumn, instrumentTypeColumn]
    CsvPreviewReport:
      type: object
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/CsvPreviewRow"
        rowCount:
          type: integer
          minimum: 0
        suggestedMapping:
          $ref: "#/components/schemas/CsvColumnMappingSuggestions"
        note:
          type: string
      required: [columns, rows, rowCount, suggestedMapping, note]
    PortfolioValidatedHolding:
      type: object
      properties:
        ticker:
          type: string
        exchange:
          $ref: "#/components/schemas/Exchange"
        instrumentType:
          $ref: "#/components/schemas/InstrumentType"
        quantity:
          type: number
          exclusiveMinimum: 0
      required: [ticker, exchange, instrumentType, quantity]
    PortfolioInputIssue:
      type: object
      properties:
        row:
          type: integer
          minimum: 1
        code:
          type: string
        message:
          type: string
      required: [row, code, message]
    PortfolioInputError:
      type: object
      properties:
        error:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioInputIssue"
      required: [error]
    PortfolioValidationReport:
      type: object
      properties:
        valid:
          type: boolean
        holdings:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioValidatedHolding"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioInputIssue"
      required: [valid, holdings, issues]
    MarketUniverseInstrument:
      type: object
      properties:
        ticker:
          type: string
        exchange:
          $ref: "#/components/schemas/Exchange"
        instrumentType:
          $ref: "#/components/schemas/InstrumentType"
      required: [ticker, exchange, instrumentType]
    MarketDataUniverse:
      type: object
      properties:
        source:
          type: string
        instruments:
          type: array
          items:
            $ref: "#/components/schemas/MarketUniverseInstrument"
      required: [source, instruments]
    DataGap:
      type: object
      properties:
        previousDate:
          type: string
          format: date
        nextDate:
          type: string
          format: date
        calendarDays:
          type: integer
        note:
          type: string
      required: [previousDate, nextDate, calendarDays, note]
    SuspiciousJump:
      type: object
      properties:
        date:
          type: string
          format: date
        priceBasis:
          type: string
          enum: [adjusted_close, close]
        percentChange:
          type: number
        note:
          type: string
      required: [date, priceBasis, percentChange, note]
    SplitEvent:
      type: object
      properties:
        date:
          type: string
          format: date
        ratio:
          type: number
      required: [date, ratio]
    InstrumentMarketReport:
      type: object
      properties:
        ticker:
          type: string
        exchange:
          $ref: "#/components/schemas/Exchange"
        instrumentType:
          $ref: "#/components/schemas/InstrumentType"
        yahooSymbol:
          type: string
        status:
          type: string
          enum: [success, skipped]
        skipReason:
          type: ["string", "null"]
        dataType:
          type: string
          enum: [observed, proxy, insufficient]
        proxyInstrument:
          type: ["string", "null"]
        proxyStartDate:
          type: ["string", "null"]
          format: date
        proxyEndDate:
          type: ["string", "null"]
          format: date
        coverageStart:
          type: ["string", "null"]
          format: date
        coverageEnd:
          type: ["string", "null"]
          format: date
        asOfDate:
          type: ["string", "null"]
          format: date
        observationCount:
          type: integer
          minimum: 0
        adjustedCloseCount:
          type: integer
          minimum: 0
        missingAdjustedCloseCount:
          type: integer
          minimum: 0
        calendarGaps:
          type: array
          items:
            $ref: "#/components/schemas/DataGap"
        suspiciousJumps:
          type: array
          items:
            $ref: "#/components/schemas/SuspiciousJump"
        splits:
          type: array
          items:
            $ref: "#/components/schemas/SplitEvent"
        adjustmentConcerns:
          type: array
          items:
            type: string
      required:
        - ticker
        - exchange
        - instrumentType
        - yahooSymbol
        - status
        - skipReason
        - dataType
        - proxyInstrument
        - proxyStartDate
        - proxyEndDate
        - coverageStart
        - coverageEnd
        - asOfDate
        - observationCount
        - adjustedCloseCount
        - missingAdjustedCloseCount
        - calendarGaps
        - suspiciousJumps
        - splits
        - adjustmentConcerns
    PortfolioInspectSummary:
      type: object
      properties:
        requested:
          type: integer
        succeeded:
          type: integer
        skipped:
          type: integer
      required: [requested, succeeded, skipped]
    PortfolioInspectReport:
      type: object
      properties:
        source:
          type: string
        checkedAt:
          type: string
          format: date-time
        summary:
          $ref: "#/components/schemas/PortfolioInspectSummary"
        instruments:
          type: array
          items:
            $ref: "#/components/schemas/InstrumentMarketReport"
        dataNotes:
          type: array
          items:
            type: string
        valuation:
          $ref: "#/components/schemas/PortfolioValuation"
      required: [source, checkedAt, summary, instruments, dataNotes]
    ValuedHolding:
      type: object
      required: [ticker, exchange, instrumentType, quantity, priceInr, asOfDate, valueInr, weightPct, reason]
      properties:
        ticker: { type: string }
        exchange: { $ref: "#/components/schemas/Exchange" }
        instrumentType: { $ref: "#/components/schemas/InstrumentType" }
        quantity: { type: number }
        priceInr: { type: ["number", "null"] }
        asOfDate: { type: ["string", "null"] }
        valueInr: { type: ["number", "null"] }
        weightPct: { type: ["number", "null"] }
        reason: { type: ["string", "null"] }
    ValuationAllocation:
      type: object
      required: [instrumentType, valueInr, weightPct]
      properties:
        instrumentType: { $ref: "#/components/schemas/InstrumentType" }
        valueInr: { type: number }
        weightPct: { type: number }
    PortfolioValuation:
      type: object
      required: [status, asOfDate, totalValueInr, holdings, allocations, reason, notes]
      properties:
        status: { type: string, enum: [complete, unavailable] }
        asOfDate: { type: ["string", "null"] }
        totalValueInr: { type: ["number", "null"] }
        holdings:
          type: array
          items: { $ref: "#/components/schemas/ValuedHolding" }
        allocations:
          type: array
          items: { $ref: "#/components/schemas/ValuationAllocation" }
        reason: { type: ["string", "null"] }
        notes:
          type: array
          items: { type: string }
    RiskInstrumentCoverage:
      type: object
      properties:
        ticker:
          type: string
        instrumentType:
          $ref: "#/components/schemas/InstrumentType"
        dataType:
          type: string
          enum: [observed, proxy, insufficient]
        sourceSymbol:
          type: ["string", "null"]
        proxyInstrument:
          type: ["string", "null"]
        coverageStart:
          type: ["string", "null"]
          format: date
        coverageEnd:
          type: ["string", "null"]
          format: date
        observationCount:
          type: integer
          minimum: 0
        missingAlignedObservations:
          type: integer
          minimum: 0
        note:
          type: string
      required:
        - ticker
        - instrumentType
        - dataType
        - sourceSymbol
        - proxyInstrument
        - coverageStart
        - coverageEnd
        - observationCount
        - missingAlignedObservations
        - note
    ReplayPortfolioPoint:
      type: object
      properties:
        date:
          type: string
          format: date
        portfolioValue:
          type: number
          description: Python-calculated adjusted-close value in INR; not an account statement.
        normalizedValueIndex:
          type: number
          description: Python-calculated series rebased to 100 at the first available replay observation.
      required: [date, portfolioValue, normalizedValueIndex]
    ReplayWindowResult:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          type: string
          enum: [complete, incomplete, unavailable]
        coverageStart:
          type: ["string", "null"]
          format: date
        coverageEnd:
          type: ["string", "null"]
          format: date
        observationCount:
          type: integer
          minimum: 0
        maxDrawdownPct:
          type: ["number", "null"]
        peakValue:
          type: ["number", "null"]
        troughValue:
          type: ["number", "null"]
        troughDate:
          type: ["string", "null"]
          format: date
        recoveryStatus:
          type: string
          enum: [recovered, not_recovered, incomplete, unavailable]
        recoveryTradingDays:
          type: ["integer", "null"]
        recoveryDate:
          type: ["string", "null"]
          format: date
        path:
          type: array
          items:
            $ref: "#/components/schemas/ReplayPortfolioPoint"
        instruments:
          type: array
          items:
            $ref: "#/components/schemas/RiskInstrumentCoverage"
        notes:
          type: array
          items:
            type: string
      required:
        - id
        - name
        - startDate
        - endDate
        - status
        - coverageStart
        - coverageEnd
        - observationCount
        - maxDrawdownPct
        - peakValue
        - troughValue
        - troughDate
        - recoveryStatus
        - recoveryTradingDays
        - recoveryDate
        - path
        - instruments
        - notes
    RiskContributionItem:
      type: object
      properties:
        ticker:
          type: string
        instrumentType:
          $ref: "#/components/schemas/InstrumentType"
        latestWeightPct:
          type: number
        annualizedContributionPct:
          type: number
        contributionPct:
          type: number
      required:
        - ticker
        - instrumentType
        - latestWeightPct
        - annualizedContributionPct
        - contributionPct
    PortfolioRiskContribution:
      type: object
      properties:
        status:
          type: string
          enum: [complete, incomplete, unavailable]
        coverageStart:
          type: ["string", "null"]
          format: date
        coverageEnd:
          type: ["string", "null"]
          format: date
        observationCount:
          type: integer
          minimum: 0
        annualizedVolatilityPct:
          type: ["number", "null"]
        contributions:
          type: array
          items:
            $ref: "#/components/schemas/RiskContributionItem"
        explanation:
          type: string
        instruments:
          type: array
          items:
            $ref: "#/components/schemas/RiskInstrumentCoverage"
        notes:
          type: array
          items:
            type: string
      required:
        - status
        - coverageStart
        - coverageEnd
        - observationCount
        - annualizedVolatilityPct
        - contributions
        - explanation
        - instruments
        - notes
    PortfolioRiskAnalysisReport:
      type: object
      properties:
        source:
          type: string
        checkedAt:
          type: string
          format: date-time
        replayWindows:
          type: array
          items:
            $ref: "#/components/schemas/ReplayWindowResult"
        riskContribution:
          $ref: "#/components/schemas/PortfolioRiskContribution"
        methodNotes:
          type: array
          items:
            type: string
      required: [source, checkedAt, replayWindows, riskContribution, methodNotes]
    ScenarioOverrides:
      type: object
      additionalProperties: false
      properties:
        stockShockPct: {type: string}
        etfShockPct: {type: string}
    PortfolioStressInput:
      type: object
      additionalProperties: false
      properties:
        holdings:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/PortfolioHolding"
        scenarioId: {type: string}
        overrides:
          $ref: "#/components/schemas/ScenarioOverrides"
        targetLossPct: {type: string}
      required: [holdings, scenarioId]
    SimulationConfig:
      type: object
      properties:
        horizonTradingDays: {type: integer}
        pathCount: {type: integer}
        blockTradingDays: {type: integer}
        seed: {type: integer}
      required: [horizonTradingDays, pathCount, blockTradingDays, seed]
    ScenarioDefinition:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        kind: {type: string, enum: [hypothetical-static-json]}
        stockShockPct: {type: number}
        etfShockPct: {type: number}
        adjustments:
          type: array
          items: {type: string}
      required: [id, name, description, kind, stockShockPct, etfShockPct, adjustments]
    ShockBounds:
      type: object
      properties:
        min: {type: number}
        max: {type: number}
      required: [min, max]
    StaticScenarioLibrary:
      type: object
      properties:
        version: {type: integer}
        kind: {type: string, enum: [hypothetical-static-json]}
        shockBoundsPct:
          $ref: "#/components/schemas/ShockBounds"
        simulation:
          $ref: "#/components/schemas/SimulationConfig"
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioDefinition"
        notes:
          type: array
          items: {type: string}
      required: [version, kind, shockBoundsPct, simulation, scenarios, notes]
    ShockHoldingResult:
      type: object
      properties:
        ticker: {type: string}
        exchange: {type: string}
        shockPct: {type: number}
        impactInr: {type: number}
        stressedValueInr: {type: number}
      required: [ticker, exchange, shockPct, impactInr, stressedValueInr]
    ScenarioImpact:
      allOf:
        - $ref: "#/components/schemas/ScenarioDefinition"
        - type: object
          properties:
            status: {type: string, enum: [available, unavailable]}
            impactInr: {type: ["number", "null"]}
            lossPct: {type: ["number", "null"]}
            stressedValueInr: {type: ["number", "null"]}
            holdings:
              type: array
              items:
                $ref: "#/components/schemas/ShockHoldingResult"
            notes:
              type: array
              items: {type: string}
          required: [status, impactInr, lossPct, stressedValueInr, holdings, notes]
    ReverseStressResult:
      type: object
      properties:
        kind: {type: string, enum: [hypothetical-static-json]}
        status: {type: string, enum: [available, unavailable]}
        targetLossPct: {type: number}
        targetLossInr: {type: ["number", "null"]}
        scaleMultiplier: {type: ["number", "null"]}
        impactInr: {type: ["number", "null"]}
        lossPct: {type: ["number", "null"]}
        stressedValueInr: {type: ["number", "null"]}
        holdings:
          type: array
          items:
            $ref: "#/components/schemas/ShockHoldingResult"
        notes:
          type: array
          items: {type: string}
      required: [kind, status, targetLossPct, targetLossInr, scaleMultiplier, impactInr, lossPct, stressedValueInr, holdings, notes]
    SimulatedPath:
      type: object
      properties:
        id: {type: integer}
        valuesInr:
          type: array
          items: {type: number}
      required: [id, valuesInr]
    TerminalPercentile:
      type: object
      properties:
        percentile: {type: number}
        valueInr: {type: number}
      required: [percentile, valueInr]
    MonteCarloResult:
      type: object
      properties:
        kind: {type: string, enum: [simulated]}
        status: {type: string, enum: [complete, incomplete, unavailable]}
        config:
          $ref: "#/components/schemas/SimulationConfig"
        coverageStart: {type: ["string", "null"]}
        coverageEnd: {type: ["string", "null"]}
        validReturnCount: {type: integer}
        eligibleBlockCount: {type: integer}
        excludedIntervalCount: {type: integer}
        historyKind: {type: string, enum: [observed, proxy, mixed, insufficient]}
        instruments:
          type: array
          items:
            $ref: "#/components/schemas/RiskInstrumentCoverage"
        paths:
          type: array
          items:
            $ref: "#/components/schemas/SimulatedPath"
        terminalPercentiles:
          type: array
          items:
            $ref: "#/components/schemas/TerminalPercentile"
        lossProbabilityPct: {type: ["number", "null"]}
